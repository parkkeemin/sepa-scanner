name: Daily Setup Scan

on:
  schedule:
    # 평일 18:20 KST (= 09:20 UTC). SEPA 스캔(18:10)과 겹치지 않게 10분 뒤로 배치
    - cron: "20 9 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "채울 거래일 수 (최초 1회는 260)"
        required: false
        default: "3"

concurrency:
  group: daily-setup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests pandas

      - name: Run daily setup scan
        id: scan
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          TZ: Asia/Seoul
          # ────────── 기준 조정 구역 ──────────
          # 2026-08-30 적용 (사장님 결정)
          #  ① 거래대금 2,000억 → 500억
          #     8/28 스캔에서 나머지 조건을 모두 통과한 58종목의 거래대금
          #     최댓값이 1,103억이었음. 2,000억은 이 시장에서 도달 불가 문턱.
          #     ※ 원문은 "2,000억 이상이 나와야 돼요"입니다. 500억은 원문의 1/4로,
          #       이 지점부터는 '영상 기준'이 아니라 '사장님 기준'입니다.
          #  ② 최근 60일 저점 대비 +20% 미만만 — 반등 초입(매수 타이밍)만 남김
          A_MIN_VALUE:        "50000000000"   # 500억 (기본값 2,000억)
          A_MAX_RUNUP_RECENT: "1.20"          # 최근 저점 대비 +20% 미만
          RECENT_LOW_DAYS:    "60"            # '최근 저점'을 60거래일에서 탐색
          #
          # A_CHG_MAX:    "12"             # 트랙A 등락률 상한 (기본 10, 원문 5~10%)
          # A_MAX_MKTCAP: "20000000000000" # 트랙A 시총 상한 (기본 10조)
          # B_FROM_HIGH_MAX: "0.5"         # 트랙B 바닥권 (기본 0.35 = 고점 대비 65%↓)
          # B_BOX_DAYS:   "100"            # 트랙B 횡보 기간 (기본 150거래일)
          # B_VOL_ABS:    "2000000"        # 트랙B 절대 거래량 (기본 300만 주)
          # ───────────────────────────────────
        run: |
          python daily_setup.py --backfill "${{ github.event.inputs.backfill || 3 }}"

      # 스크리닝이 실패해도 수집한 시세 캐시는 반드시 저장한다.
      # (재실행 시 13분짜리 수집을 처음부터 다시 하지 않기 위해)
      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "daily-setup: $(date +'%Y-%m-%d') 스캔 결과"
            git pull --rebase --autostash
            git push
          fi

      # 텔레그램 알림 (선택) — Secrets 가 없으면 자동으로 건너뜁니다
      - name: Notify Telegram
        if: steps.scan.outcome == 'success' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          d = json.load(open("data/daily.json", encoding="utf-8"))
          reg = " / ".join(f"{r['market']} {r['state']}" for r in d["regime"])
          lines = [f"[데일리 매매 기준] {d['base_date']}", f"시장: {reg}"]
          for tr, label in (("track_a", "A 주도주"), ("track_b", "B 턴어라운드")):
              items = d.get(tr) or []
              lines.append(f"\n■ {label} {len(items)}종목")
              for s in items[:5]:
                  p = s["plan"]
                  lines.append(
                      f"· {s['name']}({s['code']}) {s['chg']:+.1f}%\n"
                      f"  매수 {p['buy_break']:,} / 손절 {p['stop']:,} / 익절 {p['target1']:,}·{p['target2']:,}")
          if d.get("warnings"):
              lines.append("\n■ 고점 경고: " + ", ".join(w["name"] for w in d["warnings"][:5]))
          lines.append("\n※ 규칙에 따른 기계적 계산값 · 투자 권유 아님")
          body = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": "\n".join(lines)}).encode()
          urllib.request.urlopen(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", body)
          print("텔레그램 전송 완료")
          PY
