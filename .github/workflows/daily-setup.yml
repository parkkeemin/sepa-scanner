name: Daily Setup Scan

on:
  schedule:
    # ① 평일 18:20 KST (= 09:20 UTC). 장 마감 직후, 그날 데이터가 올라와 있으면 여기서 잡힌다.
    - cron: "20 9 * * 1-5"
    # ② 평일 08:10 KST (= 전일 23:10 UTC). ①에서 KRX 반영이 늦어 빈손이었어도
    #    다음 날 아침에 전 거래일 데이터를 확실히 주워 담는다. 장 시작 전에 계획이 나온다.
    - cron: "10 23 * * 0-4"
  workflow_dispatch:
    inputs:
      backfill:
        description: "채울 거래일 수 (최초 1회는 260)"
        required: false
        default: "5"

concurrency:
  group: daily-setup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests pandas

      - name: Run daily setup scan
        id: scan
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          # 선별 종목 기업 분석(DART). 키가 없으면 그 부분만 조용히 건너뜁니다.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
          # ────────── 기준 조정 구역 ──────────
          # 2026-08-30 적용 (사장님 결정)
          #  ① 거래대금 2,000억 → 500억
          #     8/28 스캔에서 나머지 조건을 모두 통과한 58종목의 거래대금
          #     최댓값이 1,103억이었음. 2,000억은 이 시장에서 도달 불가 문턱.
          #     ※ 원문은 "2,000억 이상이 나와야 돼요"입니다. 500억은 원문의 1/4로,
          #       이 지점부터는 '영상 기준'이 아니라 '사장님 기준'입니다.
          #  ② 트랙 C 신설 — 저점 반등 초입은 별도 트랙으로 분리
          #     (거래대금이 터진 종목은 이미 저점 대비 50~115% 올라 있어
          #      "거래대금 + 저점 초입"을 AND 로 묶으면 교집합이 비어버림)
          A_MIN_VALUE:        "50000000000"   # 트랙A 거래대금 500억 (기본 2,000억)
          RECENT_LOW_DAYS:    "60"            # '최근 저점'을 60거래일에서 탐색
          # C_MAX_UP_FROM_LOW: "1.20"         # 트랙C 저점 대비 상한 (기본 +20%)
          # C_MIN_VALUE:       "5000000000"   # 트랙C 최소 거래대금 (기본 50억)
          # C_VOL_VS_PREV:     "3.0"          # 트랙C 전일比 거래량 (기본 300%)
          #
          # A_CHG_MAX:    "12"             # 트랙A 등락률 상한 (기본 10, 원문 5~10%)
          # A_MAX_MKTCAP: "20000000000000" # 트랙A 시총 상한 (기본 10조)
          # B_FROM_HIGH_MAX: "0.5"         # 트랙B 바닥권 (기본 0.35 = 고점 대비 65%↓)
          # B_BOX_DAYS:   "100"            # 트랙B 횡보 기간 (기본 150거래일)
          # B_VOL_ABS:    "2000000"        # 트랙B 절대 거래량 (기본 300만 주)
          # ───────────────────────────────────
        run: |
          python daily_setup.py --backfill "${{ github.event.inputs.backfill || 5 }}"

      # 스크리닝이 실패해도 수집한 시세 캐시는 반드시 저장한다.
      # (재실행 시 13분짜리 수집을 처음부터 다시 하지 않기 위해)
      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "daily-setup: $(date +'%Y-%m-%d') 스캔 결과"
            git pull --rebase --autostash
            git push
          fi

      # 텔레그램 알림 (선택) — Secrets 가 없으면 자동으로 건너뜁니다
      - name: Notify Telegram
        if: steps.scan.outcome == 'success' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          d = json.load(open("data/daily.json", encoding="utf-8"))
          reg = " / ".join(f"{r['market']} {r['state']}" for r in d["regime"])
          lines = [f"[데일리 매매 기준] {d['base_date']}", f"시장: {reg}"]
          for tr, label in (("track_a", "A 주도주"), ("track_b", "B 턴어라운드"),
                            ("track_c", "C 저점 초입")):
              items = d.get(tr) or []
              lines.append(f"\n■ {label} {len(items)}종목")
              for s in items[:5]:
                  p = s["plan"]
                  buy = p["buy_pull"] if p.get("entry") == "눌림만" else p["buy_break"]
                  how = "눌림" if p.get("entry") == "눌림만" else "돌파"
                  lines.append(
                      f"· {s['name']}({s['code']}) {s['chg']:+.1f}%\n"
                      f"  {how}매수 {buy:,} / 손절 {p['stop']:,} / 익절 {p['target1']:,}·{p['target2']:,}"
                      + (f"\n  ※ {p['max_buy']:,}원 초과 시 매수 금지" if p.get("max_buy") else ""))
          if d.get("warnings"):
              lines.append("\n■ 고점 경고: " + ", ".join(w["name"] for w in d["warnings"][:5]))
          lines.append("\n※ 규칙에 따른 기계적 계산값 · 투자 권유 아님")
          body = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": "\n".join(lines)}).encode()
          urllib.request.urlopen(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", body)
          print("텔레그램 전송 완료")
          PY
